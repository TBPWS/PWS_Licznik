<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>PWS Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
    font-family: Arial, sans-serif;
    background: #111;
    color: #eee;
    margin: 0;
    padding: 0;
}

/* --- ZAKŁADKI --- */
.tabs {
    display: flex;
    background: #1a1a1a;
    border-bottom: 2px solid #333;
    position: sticky;
    top: 0;
    z-index: 10;
}

.tab-btn {
    flex: 1;
    padding: 15px;
    background: #1a1a1a;
    color: #ccc;
    border: none;
    font-size: 18px;
    cursor: pointer;
    transition: background 0.3s, color 0.3s;
}

.tab-btn:hover {
    background: #333;
    color: #fff;
}

.tab-btn.active {
    background: #444;
    color: #fff;
    font-weight: bold;
}

/* --- SEKCJE --- */
section {
    display: none;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.3s ease, transform 0.3s ease;
    padding: 20px;
}

section.active {
    display: block;
    opacity: 1;
    transform: translateY(0);
}

/* --- TABELA --- */
table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
}

table th, table td {
    padding: 10px;
    border-bottom: 1px solid #333;
}

table th {
    background: #333;
}

canvas {
    margin-top: 30px;
    background: #222;
    padding: 20px;
    border-radius: 10px;
}
</style>
</head>

<body>

<!-- ZAKŁADKI -->
<nav class="tabs">
    <button data-tab="ranking" class="tab-btn active">🏆 Ranking</button>
    <button data-tab="historia" class="tab-btn">📈 Historia</button>
    <button data-tab="podsumowanie" class="tab-btn">📊 Podsumowanie</button>
</nav>

<!-- SEKCJA RANKING -->
<section id="ranking" class="active">
    <h2>Ranking graczy</h2>
    <table id="rankingTable"></table>
    <canvas id="rankingChart"></canvas>
</section>

<!-- SEKCJA HISTORIA -->
<section id="historia">
    <h2>Historia punktów</h2>
    <canvas id="historyChart"></canvas>
</section>

<!-- SEKCJA PODSUMOWANIE -->
<section id="podsumowanie">
    <h2>Podsumowanie</h2>
    <div id="summaryBox"></div>
</section>

<script>

// --- ZAKŁADKI + ZAPAMIĘTYWANIE ---
const lastTab = localStorage.getItem("activeTab") || "ranking";
showTab(lastTab);

document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.addEventListener("click", () => {
        const tab = btn.dataset.tab;
        showTab(tab);
        localStorage.setItem("activeTab", tab);
    });
});

function showTab(tab) {
    document.querySelectorAll("section").forEach(sec => sec.classList.remove("active"));
    document.getElementById(tab).classList.add("active");

    document.querySelectorAll(".tab-btn").forEach(btn => btn.classList.remove("active"));
    document.querySelector(`.tab-btn[data-tab="${tab}"]`).classList.add("active");
}

// --- ŁADOWANIE DANYCH ---
fetch("data.json")
    .then(r => r.json())
    .then(data => {
        buildRanking(data);
        buildRankingChart(data);
        buildHistoryChart(data);
        buildSummary(data);
    });

// --- RANKING ---
function buildRanking(data) {
    const table = document.getElementById("rankingTable");
    let html = "<tr><th>Gracz</th><th>Punkty</th><th>Skrzynie</th></tr>";

    data.players.forEach(p => {
        html += `<tr>
            <td>${p.name}</td>
            <td>${p.points}</td>
            <td>${p.chests}</td>
        </tr>`;
    });

    table.innerHTML = html;
}

// --- WYKRES RANKINGU ---
function buildRankingChart(data) {
    const ctx = document.getElementById("rankingChart");
    new Chart(ctx, {
        type: "bar",
        data: {
            labels: data.players.map(p => p.name),
            datasets: [{
                label: "Punkty",
                data: data.players.map(p => p.points),
                backgroundColor: "#4CAF50"
            }]
        }
    });
}

// --- WYKRES HISTORII ---
function buildHistoryChart(data) {
    const ctx = document.getElementById("historyChart");
    new Chart(ctx, {
        type: "line",
        data: {
            labels: data.history.map(h => h.date),
            datasets: [{
                label: "Punkty dzienne",
                data: data.history.map(h => h.points),
                borderColor: "#00BCD4",
                fill: false
            }]
        }
    });
}

// --- PODSUMOWANIE ---
function buildSummary(data) {
    const box = document.getElementById("summaryBox");
    const totalPoints = data.players.reduce((a,b)=>a+b.points,0);
    const totalChests = data.players.reduce((a,b)=>a+b.chests,0);

    box.innerHTML = `
        <p><strong>Łączna liczba punktów:</strong> ${totalPoints}</p>
        <p><strong>Łączna liczba skrzyń:</strong> ${totalChests}</p>
        <p><strong>Liczba graczy:</strong> ${data.players.length}</p>
    `;
}

</script>

</body>
</html>
