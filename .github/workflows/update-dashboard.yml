import os
import json
from pathlib import Path

from google.oauth2 import service_account
from googleapiclient.discovery import build


def main():
    # Pobranie danych z sekreta
    sheet_id = os.environ["SHEET_ID"]
    creds_json = os.environ["GOOGLE_CREDENTIALS"]
    creds_dict = json.loads(creds_json)

    # Autoryzacja
    creds = service_account.Credentials.from_service_account_info(
        creds_dict,
        scopes=["https://www.googleapis.com/auth/spreadsheets.readonly"],
    )

    service = build("sheets", "v4", credentials=creds)
    sheet = service.spreadsheets()

    # Pobranie całego arkusza
    result = sheet.values().get(
        spreadsheetId=sheet_id,
        range="A1:ZZ999",
    ).execute()

    values = result.get("values", [])

    # Zapis do pliku w folderze scripts/
    scripts_dir = Path(__file__).parent
    raw_path = scripts_dir / "data_raw.json"

    with raw_path.open("w", encoding="utf-8") as f:
        json.dump(values, f, ensure_ascii=False, indent=2)

    print(f"Pobrano arkusz do {raw_path}")


if __name__ == "__main__":
    main()

import json
import re
from pathlib import Path


def extract_points(col_name: str) -> int | None:
    """
    Szuka wzorca '__XX' w nazwie kolumny i zwraca liczbę punktów.
    Np. 'Tartaros Crypt__25' -> 25
    """
    match = re.search(r"__(\d+)", col_name)
    return int(match.group(1)) if match else None


def main():
    scripts_dir = Path(__file__).parent
    raw_path = scripts_dir / "data_raw.json"

    # Wczytanie surowych danych
    with raw_path.open("r", encoding="utf-8") as f:
        raw = json.load(f)

    if not raw or len(raw) < 2:
        print("Brak danych w arkuszu.")
        return

    columns = raw[0]
    players = []

    # Przetwarzanie każdego gracza
    for row in raw[1:]:
        if not row or len(row) < 1:
            continue

        name = row[0]
        total_points = 0
        chest_count = 0

        # Iteracja po kolumnach
        for col_index, col_name in enumerate(columns):
            points_per_item = extract_points(col_name)
            if points_per_item is None:
                continue

            try:
                value = int(row[col_index])
            except (ValueError, IndexError):
                value = 0

            total_points += value * points_per_item
            chest_count += value

        players.append({
            "name": name,
            "points": total_points,
            "chests": chest_count
        })

    # Sortowanie po punktach malejąco
    players.sort(key=lambda p: p["points"], reverse=True)

    # Zapis do głównego katalogu repo (tak jak wymaga workflow)
    repo_root = scripts_dir.parent
    output_path = repo_root / "data.json"

    with output_path.open("w", encoding="utf-8") as f:
        json.dump({"players": players}, f, ensure_ascii=False, indent=2)

    print(f"Wygenerowano dashboard do {output_path}")


if __name__ == "__main__":
    main()
